# Publicacion a Modrinth para un plugin/addon de DrakesCraft.
name: Publicar en Modrinth

on:
  push:
    branches: [main, master, 1.21-latin, fix/drakes-loans]
    paths:
      - 'src/**'
      - 'pom.xml'
      - 'build.gradle'
      - 'build.gradle.kts'
      - 'README.md'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Compilar y preparar todo pero NO publicar en Modrinth'
        type: boolean
        default: true
      force:
        description: 'Publicar aunque el cambio sea menor'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: modrinth-${{ github.ref }}
  cancel-in-progress: false

jobs:
  decidir:
    runs-on: ubuntu-latest
    outputs:
      publicar: ${{ steps.evaluar.outputs.publicar }}
      motivo: ${{ steps.evaluar.outputs.motivo }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - id: evaluar
        env:
          UMBRAL_LINEAS: '5'
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force }}" = "true" ]; then
            echo "publicar=true"  >> "$GITHUB_OUTPUT"
            echo "motivo=disparo manual con force"  >> "$GITHUB_OUTPUT"
            exit 0
          fi

          MENSAJE="$(git log -1 --pretty=%B || true)"
          if echo "$MENSAJE" | grep -qiE '\[URGENT\]|\[HOTFIX\]|fix: *dupe|fix: *crash|dupe|exploit'; then
            echo "publicar=true"  >> "$GITHUB_OUTPUT"
            echo "motivo=hotfix detectado en el mensaje del commit"  >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git rev-parse HEAD~1 >/dev/null 2>&1; then
            LINEAS="$(git diff --numstat HEAD~1 HEAD -- 'src/**' pom.xml build.gradle build.gradle.kts 2>/dev/null                       | awk '{ s += $1 + $2 } END { print s + 0 }')"
          else
            LINEAS=9999
          fi

          echo "Lineas de codigo cambiadas: $LINEAS (umbral $UMBRAL_LINEAS)"
          if [ "$LINEAS" -ge "${UMBRAL_LINEAS}" ]; then
            echo "publicar=true"  >> "$GITHUB_OUTPUT"
            echo "motivo=cambio de $LINEAS lineas (>= $UMBRAL_LINEAS)"  >> "$GITHUB_OUTPUT"
          else
            echo "publicar=false" >> "$GITHUB_OUTPUT"
            echo "motivo=cambio menor de $LINEAS lineas; no se satura Modrinth"  >> "$GITHUB_OUTPUT"
          fi

  publicar:
    needs: decidir
    if: needs.decidir.outputs.publicar == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Preparar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Compilar
        run: |
          set -euo pipefail
          if [ -f pom.xml ]; then
            mvn -B -ntp package -DskipTests
          elif [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew build -x test --no-daemon
          elif [ -f build.gradle ] || [ -f build.gradle.kts ]; then
            gradle build -x test --no-daemon
          else
            echo "No se encontro build descriptor (pom.xml ni build.gradle)"
            exit 1
          fi

      - name: Localizar el jar
        id: jar
        run: |
          set -euo pipefail
          RUTA=""
          if [ -d target ]; then
            RUTA="$(find target -maxdepth 2 -name '*.jar' ! -name 'original-*' ! -name '*-sources.jar' ! -name '*-javadoc.jar' | head -n1 || true)"
          elif [ -d build/libs ]; then
            RUTA="$(find build/libs -maxdepth 2 -name '*.jar' ! -name 'original-*' ! -name '*-sources.jar' ! -name '*-javadoc.jar' | head -n1 || true)"
          fi
          if [ -z "$RUTA" ]; then echo "No se encontro el jar compilado"; exit 1; fi
          echo "ruta=$RUTA" >> "$GITHUB_OUTPUT"
          VER="0.0.0-${GITHUB_SHA:0:7}"
          if [ -f pom.xml ]; then
            POM_VER="$(mvn -q -ntp help:evaluate -Dexpression=project.version -DforceStdout 2>/dev/null | tail -n1 | tr -d '[:space:]' || true)"
            case "$POM_VER" in ''|*ERROR*|*'$'*) ;; *) VER="$POM_VER";; esac
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "Version detectada: $VER"

      - name: Preparar Node para la conversion del banner
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Convertir el banner SVG animado a GIF para Modrinth
        run: |
          set -euo pipefail
          SVG="$(find docs assets . -maxdepth 2 -name 'banner.svg' -o -name '*banner*.svg' 2>/dev/null | head -n1 || true)"
          if [ -n "$SVG" ] && [ -f .github/scripts/svg-to-gif.mjs ]; then
            sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick
            npm install --no-save puppeteer@23
            mkdir -p .modrinth
            node .github/scripts/svg-to-gif.mjs "$SVG" .modrinth/banner.gif || true
            echo "Banner convertido: $SVG -> .modrinth/banner.gif"
          else
            echo "Sin banner o script; se omite la conversion."
          fi

      - name: Asegurar que el proyecto existe en Modrinth
        id: cfg
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          MODRINTH_PROJECT_ID: ${{ vars.MODRINTH_PROJECT_ID }}
          PROJECT_SLUG: ${{ github.event.repository.name }}
          PROJECT_NAME: ${{ github.event.repository.name }}
          PROJECT_SUMMARY: ${{ github.event.repository.description }}
          MODRINTH_DRAFT: ${{ vars.MODRINTH_DRAFT }}
          PROJECT_LICENSE: ${{ vars.MODRINTH_LICENSE }}
        run: |
          if [ -f .github/scripts/modrinth-ensure-project.mjs ]; then
            node .github/scripts/modrinth-ensure-project.mjs
          else
            echo "No existe modrinth-ensure-project.mjs"
            exit 1
          fi

      - name: Publicar en Modrinth
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ steps.cfg.outputs.project_id }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          files: ${{ steps.jar.outputs.ruta }}
          version: ${{ steps.jar.outputs.version }}
          name: ${{ github.event.repository.name }} ${{ steps.jar.outputs.version }}
          version-type: release
          loaders: |
            paper
            purpur
            spigot
          game-versions: |
            1.21.x
          changelog: ${{ needs.decidir.outputs.motivo }}
          modrinth-featured: false

      - name: Enviar el proyecto a revision de Modrinth
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          MODRINTH_PROJECT_ID: ${{ steps.cfg.outputs.project_id }}
          MODRINTH_DRAFT: ${{ vars.MODRINTH_DRAFT }}
        run: |
          if [ -f .github/scripts/modrinth-submit-review.mjs ]; then
            node .github/scripts/modrinth-submit-review.mjs || true
          fi

      - name: Resumen
        if: always()
        run: |
          echo "### Publicacion en Modrinth" >> "$GITHUB_STEP_SUMMARY"
          echo "- Motivo: ${{ needs.decidir.outputs.motivo }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Jar: ${{ steps.jar.outputs.ruta }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Proyecto Modrinth: ${{ steps.cfg.outputs.project_slug }}" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "- **dry_run: no se publico nada**" >> "$GITHUB_STEP_SUMMARY"
          fi
