name: Resource Pack — Build & Release

on:
  push:
    branches: [main]
    paths:
      - 'PortTextura/Jackstar-Slimefun-Drakecraft/**'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # para crear releases

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Calcular versión (fecha + short SHA)
        id: ver
        run: |
          echo "tag=resourcepack-$(date +'%Y%m%d')-${GITHUB_SHA::7}" >> $GITHUB_OUTPUT
          echo "name=Resource Pack $(date +'%Y-%m-%d') (${GITHUB_SHA::7})" >> $GITHUB_OUTPUT

      - name: Crear ZIP compatible con Minecraft
        # pack.mcmeta debe estar en la raíz del ZIP, no dentro de una subcarpeta
        run: |
          cd PortTextura/Jackstar-Slimefun-Drakecraft
          zip -r ../../Jackstar-Slimefun-Drakecraft.zip . \
            --exclude "*.git*" --exclude "README.md" --exclude "item-models.yml"
          cd ../..
          echo "SHA256: $(sha256sum Jackstar-Slimefun-Drakecraft.zip | cut -d' ' -f1)"

      - name: Crear GitHub Release
        id: release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.name }}
          body: |
            ## Resource Pack — Jackstar Slimefun DrakesCraft

            Pack format: `34` (Minecraft 1.21–1.21.1)

            ### Instalación en server.properties
            ```
            resource-pack=<URL_DEL_ARCHIVO_ABAJO>
            resource-pack-sha1=<SHA256>
            ```

            > Generado automáticamente al detectar cambios en `PortTextura/`.
          files: Jackstar-Slimefun-Drakecraft.zip
          make_latest: true

      - name: Deploy a pack.drakescraft.cl
        env:
          DEPLOY_KEY: ${{ secrets.STAR_DEPLOY_KEY }}
        run: |
          echo "$DEPLOY_KEY" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key
          SHA1=$(sha1sum Jackstar-Slimefun-Drakecraft.zip | cut -d' ' -f1)
          echo "$SHA1" > latest.sha1
          scp -i /tmp/deploy_key -o StrictHostKeyChecking=no \
            Jackstar-Slimefun-Drakecraft.zip latest.sha1 \
            jack@100.86.86.50:/srv/resourcepack/
          # Renombrar a latest.zip (URL fija que no cambia nunca)
          ssh -i /tmp/deploy_key -o StrictHostKeyChecking=no jack@100.86.86.50 \
            "mv /srv/resourcepack/Jackstar-Slimefun-Drakecraft.zip /srv/resourcepack/latest.zip"
          rm /tmp/deploy_key

      - name: Notificar en Discord
        env:
          WEBHOOK: ${{ secrets.DISCORD_RESOURCEPACK_WEBHOOK }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          SHA1=$(sha1sum Jackstar-Slimefun-Drakecraft.zip | cut -d' ' -f1)
          SIZE=$(du -sh Jackstar-Slimefun-Drakecraft.zip | cut -f1)

          curl -s -X POST "$WEBHOOK" \
            -H "Content-Type: application/json" \
            -d "{
              \"username\": \"DrakesCraft · Resource Pack CI\",
              \"embeds\": [{
                \"title\": \"🎨 Nuevo resource pack publicado\",
                \"description\": \"Se detectaron cambios en \`PortTextura/\` y se generó una nueva build automáticamente.\",
                \"color\": 5763719,
                \"fields\": [
                  {\"name\": \"📦 Versión\", \"value\": \"\`$TAG\`\", \"inline\": true},
                  {\"name\": \"📁 Tamaño\", \"value\": \"\`$SIZE\`\", \"inline\": true},
                  {\"name\": \"🔐 SHA1\", \"value\": \"\`\`\`$SHA1\`\`\`\", \"inline\": false},
                  {\"name\": \"⬇️ URL permanente\", \"value\": \"https://pack.drakescraft.cl/latest.zip\", \"inline\": false}
                ],
                \"footer\": {\"text\": \"resource-pack-sha1=$SHA1\"}
              }]
            }"
