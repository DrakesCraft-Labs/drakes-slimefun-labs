    name: "&eDirectorio de Gallinas GCE"

recipes:
  from_net:
    name: "&aRed para Gallinas"
    lore:
      - "&fCaptura una gallina con la &aRed para Gallinas,"
      - "&fo criala en un &eGallinero Privado."
  from_chicken:
    name: "&eCamara de Excitacion"
    lore:
      - "&fObtenido de una &bGallina de Bolsillo,"
      - "&fen una &eCamara de Excitacion."
  bio_cloning:
    name: "&aCuba de Bioclonacion"
    lore:
      - "&fClonada a partir de una &bGallina de Bolsillo &fadulta,"
      - "&futilizando &aGel Nutritivo."
  mutagenic_splicing:
    name: "&dEmpalmador Mutagenico"
    lore:
      - "&fTransmutada usando un &dSuero Mutagenico"
      - "&fy el material catalizador deseado."
  industrial_roost:
    name: "&6Gallinero Industrial"
    lore:
      - "&fGallinero multiranura de alto rendimiento,"
      - "&fcompacta la produccion en un solo bloque."

items:
  POCKET_CHICKEN:
    name: "&bPocket Chicken (Gallina de Bolsillo)"
    lore:
      - "&7Haz clic derecho en un bloque"
      - "&7para liberar la gallina al mundo."
  CHICKEN_NET:
    name: "&aRed para Gallinas"
    lore:
      - "&7Permite capturar gallinas en formato portatil."
  WATER_EGG:
    name: "&9Huevo de Agua"
    lore:
      - "&7Contiene agua pura condensada."
  LAVA_EGG:
    name: "&cHuevo de Lava"
    lore:
      - "&7Contiene magma ardiente comprimido."
  GENETIC_SEQUENCER:
    name: "&eSecuenciador Genetico"
    lore:
      - "&7Determina el genotipo y fenotipo de la gallina."
  EXCITATION_CHAMBER:
    name: "&eCamara de Excitacion"
    lore:
      - "&7Estimula electricamente a las gallinas para producir recursos."
  EXCITATION_CHAMBER_2:
    name: "&eCamara de Excitacion Potenciada"
    lore:
      - "&7Genera recursos a mayor velocidad."
  EXCITATION_CHAMBER_3:
    name: "&eCamara de Excitacion Suprema"
    lore:
      - "&7Genera recursos a velocidad extrema."
  EXCITATION_CHAMBER_4:
    name: "&5Camara de Excitacion Cuantica"
    lore:
      - "&7Genera recursos a velocidad cuantica desfasada."
      - "&7Velocidad de procesamiento: &d25x"
  PRIVATE_COOP:
    name: "&eGallinero Privado"
    lore:
      - "&7Permite cruzar y criar dos gallinas adultas."
  RESTORATION_CHAMBER:
    name: "&eCamara de Restauracion"
    lore:
      - "&7Cura y revitaliza gallinas fatigadas o heridas."
  GROWTH_CHAMBER:
    name: "&eCamara de Crecimiento"
    lore:
      - "&7Acelera el crecimiento de crias de gallina"
      - "&7utilizando semillas o piensos enriquecidos."
  BIO_CLONING_VAT:
    name: "&aCuba de Bioclonacion"
    lore:
      - "&7Duplica ejemplares adultos con Gel Nutritivo."
      - "&7Conserva al 100% el genoma y la cepa original."
  MUTAGENIC_SPLICER:
    name: "&dEmpalmador Mutagenico"
    lore:
      - "&7Ingenieria genetica de precision."
      - "&7Permite mutar gallinas a aleaciones y cepas cosmicas."
  INDUSTRIAL_ROOST:
    name: "&6Gallinero Industrial"
    lore:
      - "&7Aloja hasta 4 gallinas adultas del mismo tipo."
      - "&7Multiplica la cosecha y reduce el lag en el servidor."
  MUTAGENIC_SERUM:
    name: "&dSuero Mutagenico"
    lore:
      - "&7Reactivo mutagenico altamente inestable."
      - "&7Utilizado en el &eEmpalmador Mutagenico&7."
  NUTRIENT_GEL:
    name: "&aGel Nutritivo"
    lore:
      - "&7Sustrato biologico para mitosis acelerada."
      - "&7Utilizado en la &eCuba de Bioclonacion&7."
  RAPID_GROWTH_FEED:
    name: "&ePienso de Crecimiento Rapido"
    lore:
      - "&7Pienso enriquecido con bioestimulantes."
      - "&eReduce la incubacion a solo 10 segundos&7."
  FORTIFIED_VITA_FEED:
    name: "&bPienso Vitaminico Fortificante"
    lore:
      - "&7Pienso protector vitaminado."
      - "&aProtege a las aves del desgaste y dano por fatiga&7."
  EXCITATION_CATALYST:
    name: "&6Catalizador de Hiperexitacion"
    lore:
      - "&7Catalizador ionico de resonancia de vacio."
      - "&6+35% probabilidad de obtener cosecha doble&7."

