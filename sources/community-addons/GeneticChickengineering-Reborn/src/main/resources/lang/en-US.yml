    name: "&6Industrial Roost"
    lore:
      - "&fHigh-throughput multi-chicken roost,"
      - "&fcompacting production into a single block."

items:
  POCKET_CHICKEN:
    name: "&bPocket Chicken"
    lore:
      - "&7Right click on a block"
      - "&7to release the chicken."
  CHICKEN_NET:
    name: "&aChicken Net"
    lore:
      - "&7Make chicken portable."
  WATER_EGG:
    name: "&9Water Egg"
    lore:
      - "&7Contains water."
  LAVA_EGG:
    name: "&cLava Egg"
    lore:
      - "&7Contains lava."
  GENETIC_SEQUENCER:
    name: "&eGenetic Sequencer"
    lore:
      - "&7Used to determine a chicken's genotype."
  EXCITATION_CHAMBER:
    name: "&eExcitation Chamber"
    lore:
      - "&7Enables chickens to produce resources."
  EXCITATION_CHAMBER_2:
    name: "&eBoosted Excitation Chamber"
    lore:
      - "&7Enables chickens to produce resources"
      - "&7faster."
  EXCITATION_CHAMBER_3:
    name: "&eUltimate Excitation Chamber"
    lore:
      - "&7Enables chickens to produce resources"
      - "&7much faster."
  EXCITATION_CHAMBER_4:
    name: "&5Quantum Excitation Chamber"
    lore:
      - "&7Produces resources at quantum speed."
      - "&7Speed: &d25x"
  PRIVATE_COOP:
    name: "&ePrivate Coop"
    lore:
      - "&7Can store and breed chickens."
  RESTORATION_CHAMBER:
    name: "&eRestoration Chamber"
    lore:
      - "&7Can heal chickens."
  GROWTH_CHAMBER:
    name: "&eGrowth Chamber"
    lore:
      - "&7Can raise baby chickens"
      - "&7with seeds or rapid growth feed."
  BIO_CLONING_VAT:
    name: "&aBio-Cloning Vat"
    lore:
      - "&7Duplicates adult chickens with Nutrient Gel."
      - "&7Preserves 100% of genotype and strain."
  MUTAGENIC_SPLICER:
    name: "&dMutagenic Splicer"
    lore:
      - "&7Transmutes chickens into advanced Slimefun"
      - "&7alloys, nuclear, and cosmic strains."
  INDUSTRIAL_ROOST:
    name: "&6Industrial Roost"
    lore:
      - "&7Houses up to 4 adult chickens of the same type."
      - "&7Multiplies yields and reduces server lag."
  MUTAGENIC_SERUM:
    name: "&dMutagenic Serum"
    lore:
      - "&7Highly reactive mutagenic reagent."
      - "&7Used in the &eMutagenic Splicer&7."
  NUTRIENT_GEL:
    name: "&aNutrient Gel"
    lore:
      - "&7Rich nutrient substrate for mitosis."
      - "&7Used in the &eBio-Cloning Vat&7."
  RAPID_GROWTH_FEED:
    name: "&eRapid Growth Feed"
    lore:
      - "&7Feed enriched with growth hormones."
      - "&eReduces maturation time to only 10 seconds&7."
  FORTIFIED_VITA_FEED:
    name: "&bFortified Vita-Feed"
    lore:
      - "&7Fortifying vitamin poultry feed."
      - "&aGrants immunity to strain and pain damage&7."
  EXCITATION_CATALYST:
    name: "&6Excitation Catalyst"
    lore:
      - "&7Resonance ionic catalyst."
      - "&6+35% chance for double resource drop&7."

