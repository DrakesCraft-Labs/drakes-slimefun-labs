  from_net:
    name: "&aChicken Net"
    lore:
      - "&fCapture with a &aChicken Net,"
      - "&for breed in a &ePrivate Coop."
  from_chicken:
    name: "&eExcitation Chamber"
    lore:
      - "&fObtained from a &bPocket Chicken,"
      - "&fin an &eExcitation Chamber."
  bio_cloning:
    name: "&aBio-Cloning Vat"
    lore:
      - "&fCloned from an adult &bPocket Chicken,"
      - "&fusing &aNutrient Gel."
  mutagenic_splicing:
    name: "&dMutagenic Splicer"
    lore:
      - "&fTransmuted using a &dMutagenic Serum"
      - "&fand the desired catalyst material."
